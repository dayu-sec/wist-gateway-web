name: Build & Test

on:
  push:
    branches:
      - "*"
  pull_request:
    types: [opened, reopened]
    branches:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test (bundle token leak)
        run: npm run test:bundle

      - name: Test (routes contract)
        run: npm run test:routes

      # 双语取词的最小不变量：默认 zh、双向切换、占位符、与共享口径同源。
      - name: Test (i18n contract)
        run: npm run test:i18n

      # 上送目标 + 启用开关的契约（host/port/enabled 的收发与默认值）。
      - name: Test (agent uplink contract)
        run: npm run test:uplink

      # 上送表单的决策（没改动不许存 / 校验文案 / 全队动作警告的时机）。
      - name: Test (agent uplink form)
        run: npm run test:uplink-form

      - name: Test (agent purpose contract)
        run: npm run test:agent-purpose

      # 事实摘要「复制 JSON」粘出去的载荷（字段名/数组形态/空值保留）。
      - name: Test (agent purpose export)
        run: npm run test:agent-purpose-export

      - name: Test (knowledge contract)
        run: npm run test:knowledge

      # 管理接口读取失败的文案（服务端正文必须透出来，通用话只能兜底）。
      - name: Test (admin api error messages)
        run: npm run test:admin-api-error

      # 管理 token 的传输机制（存哪 / Bearer 注入 / 401 自动清 / 429 保留 + Retry-After）。
      - name: Test (admin token mechanism)
        run: npm run test:admin-token

      # 「已托管包」表的纯派生：一行 = 一个版本、在用判定（按摘要对齐）、缺件平台。
      - name: Test (agent package registry)
        run: npm run test:agent-package-registry

      # 安装 / 重装命令的拼装：重装标记（WIST_AGENTD_REINSTALL=1）必须进两份产物，
      # 否则粘过去的命令会静默降级成普通安装（证书根本不会换）。
      - name: Test (install command contract)
        run: npm run test:install-command
