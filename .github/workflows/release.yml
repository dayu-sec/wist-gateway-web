name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: read

jobs:
  # 1. 发版前先校验：构建 + 测试必须全过才发镜像。
  #
  #    为什么要在这里再做一次：ci.yml 的 push 过滤是 `branches`，**tag 推送不会触发它**，
  #    所以不加这一步，镜像可以在完全未经校验的情况下发布。
  #    步骤与 ci.yml 保持一致（本项目有两条测试脚本，将来新增也放这里）。
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test (bundle token leak)
        run: npm run test:bundle

      - name: Test (gateway initialize contract)
        run: npm run test:gateway-initialize

  # 2. 构建多架构镜像并推送 ghcr.io。
  docker:
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 国内镜像源（腾讯云 TCR）：国内服务器拉 ghcr.io 很慢，客户端改用 TCR 地址。
      # 凭据在 TCR 控制台生成（访问凭证），存 GitHub Secrets：TCR_USERNAME / TCR_PASSWORD。
      - name: Login to TCR
        uses: docker/login-action@v4
        with:
          registry: dy-sec.tencentcloudcr.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Compute image tags
        id: meta
        run: |
          # 预发布 tag（v0.1.3-alpha / -beta / -rc …）只推该 tag，**不覆盖 :latest**。
          # 否则 :latest 会指向预发布产物，而 wist-gateway-stack 是按 :latest 拉镜像的
          # （历史上 :latest 曾指向 v0.1.3-alpha）。两个源（ghcr / TCR）同进退。
          tcr="dy-sec.tencentcloudcr.com/cloud/wist-gateway-web"
          tags="ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          tags="$(printf '%s\n%s' "$tags" "$tcr:${{ github.ref_name }}")"
          case "${{ github.ref_name }}" in
            *-*)
              ;;
            *)
              tags="$(printf '%s\n%s' "$tags" "ghcr.io/${{ github.repository }}:latest")"
              tags="$(printf '%s\n%s' "$tags" "$tcr:latest")"
              ;;
          esac
          printf 'tags<<__EOF__\n%s\n__EOF__\n' "$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64

# 对齐说明：本文件原先与 wist-center-web 的 release.yml 逐字节相同。本次两处改动
# （发版前 verify、预发布不覆盖 :latest）是为对齐该仓库而同步过来的，两个仓库保持同构：
#   - CI 的两处对齐（ci.yml 只移除不存在的 step）是 center-web 单边的，本仓无需改；
#   - 镜像地址用 `github.repository`，构建契约（context: . + APP_VERSION）由本仓 Dockerfile 满足。
