<!-- WarpGateway（边缘网关）：单格立方体（网关运行时/包）。
     配色与中心同色系 —— 同一起点 #8b5cf6（也是本 app 的界面主色），末端走到青：
     中心 = 紫罗兰→紫的蜂巢，网关 = 紫罗兰→青的单格。并排是一套，16px 也分得开。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" role="img" aria-label="WarpGateway">
  <defs>
    <linearGradient id="gateway-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6" />
      <stop offset="0.55" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="20" height="20" rx="5" fill="url(#gateway-badge)" />
  <path d="M10 3.4 16.4 7v6L10 16.6 3.6 13V7Z" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" />
  <circle cx="10" cy="10" r="1.9" fill="#ffffff" />
</svg>
